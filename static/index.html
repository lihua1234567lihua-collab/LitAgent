<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LitAgent</title>
  <style>
    body { font-family: sans-serif; margin: 0; color: #202123; }
    .chat-layout { display: flex; gap: 0; height: 100vh; min-height: 420px; }
    .sidebar { box-sizing: border-box; display: flex; flex: 0 0 260px; flex-direction: column; width: 260px; height: 100vh; padding: 8px 10px; overflow: hidden; background: #f7f7f8; }
    .sidebar-brand { display: flex; flex: 0 0 48px; align-items: center; height: 48px; padding: 0 8px; font-size: 19px; font-weight: 600; }
    .sidebar button { color: inherit; font-family: inherit; }
    #new-chat-button { display: flex; flex: 0 0 40px; align-items: center; gap: 10px; width: 100%; height: 40px; margin: 4px 0 0; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; font-size: 14px; text-align: left; cursor: pointer; }
    #new-chat-button:hover { background: #ececef; }
    .new-chat-icon { width: 18px; font-size: 19px; line-height: 1; text-align: center; }
    .sidebar-section-label { flex: 0 0 auto; margin: 18px 0 6px; padding-left: 8px; color: #777; font-size: 12px; line-height: 20px; }
    #conversation-list { display: grid; flex: 1 1 auto; align-content: start; gap: 2px; min-height: 0; margin-top: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #c5c5c5 transparent; }
    #conversation-list::-webkit-scrollbar { width: 6px; }
    #conversation-list::-webkit-scrollbar-track { background: transparent; }
    #conversation-list::-webkit-scrollbar-thumb { border-radius: 999px; background: #c5c5c5; }
    #conversation-list::-webkit-scrollbar-thumb:hover { background: #aaa; }
    .conversation-item { display: flex; align-items: center; gap: 2px; min-width: 0; height: 38px; padding: 0 4px 0 8px; position: relative; border-radius: 8px; }
    .conversation-item:hover { background: #ececef; }
    .conversation-item.active { background: #e9e9eb; }
    .conversation-button { flex: 1; min-width: 0; height: 100%; margin: 0; padding: 0; overflow: hidden; border: 0; border-radius: 0; background: transparent; font-size: 14px; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .conversation-button:hover { background: transparent; }
    .conversation-menu-trigger { flex: 0 0 30px; width: 30px; height: 30px; margin: 0; padding: 4px; border: 0; border-radius: 6px; background: transparent; font-size: 18px; line-height: 1; opacity: 0.15; cursor: pointer; }
    .conversation-item:hover .conversation-menu-trigger,
    .conversation-item:focus-within .conversation-menu-trigger { opacity: 1; background: #dedee1; }
    .conversation-menu { position: absolute; z-index: 2; top: calc(100% + 2px); right: 4px; min-width: 120px; padding: 4px; background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 14px #0002; }
    .conversation-menu[hidden] { display: none; }
    .conversation-menu button { width: 100%; margin: 0; padding: 8px 10px; border: 0; border-radius: 5px; background: transparent; text-align: left; cursor: pointer; }
    .conversation-menu button:hover { background: #f2f2f2; }
    .conversation-menu .conversation-delete-action { color: #b42318; }
    .conversation-rename-input { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid #888; border-radius: 6px; font: inherit; outline: 2px solid #bbb; }
    .chat-main { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    #message-list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px max(16px, calc((100% - 900px) / 2)); scroll-behavior: smooth; }
    .message-row { display: flex; margin: 20px 0; }
    .message-row.user { justify-content: flex-end; }
    .message-row.assistant { justify-content: flex-start; }
    .message-bubble { width: fit-content; max-width: min(82%, 760px); padding: 12px 16px; border-radius: 18px; overflow-wrap: anywhere; }
    .message-row.user .message-bubble { background: #f2f2f2; }
    .message-row.assistant .message-bubble { max-width: min(100%, 820px); padding-left: 0; }
    .message-content { font-size: 15px; line-height: 1.7; }
    .message-content > :first-child { margin-top: 0; }
    .message-content > :last-child { margin-bottom: 0; }
    .message-content h1, .message-content h2, .message-content h3 { line-height: 1.3; margin: 1.25em 0 0.55em; }
    .message-content p, .message-content ul, .message-content ol, .message-content blockquote { margin: 0.7em 0; }
    .message-content ul, .message-content ol { padding-left: 1.5em; }
    .message-content blockquote { border-left: 3px solid #d1d5db; padding-left: 12px; color: #555; }
    .message-content pre { overflow-x: auto; padding: 14px 16px; background: #f6f6f6; border: 1px solid #e5e5e5; border-radius: 10px; }
    .message-content code { font-family: Consolas, monospace; font-size: 0.92em; }
    .message-content :not(pre) > code { padding: 2px 5px; background: #f1f1f1; border-radius: 5px; }
    .message-content table { display: block; overflow-x: auto; border-collapse: collapse; max-width: 100%; }
    .message-content th, .message-content td { border: 1px solid #ddd; padding: 6px 8px; }
    .message-content a { color: #2563a6; }
    #chat-form { flex: 0 0 auto; padding: 10px 14px 8px; background: #fff; border: 1px solid #dedede; border-radius: 18px; box-shadow: 0 2px 12px #0000000a; }
    #message { display: block; width: 100%; min-height: 54px; max-height: 220px; resize: vertical; box-sizing: border-box; padding: 8px 2px; border: 0; outline: 0; font: inherit; line-height: 1.5; }
    .composer-actions { display: flex; justify-content: flex-end; gap: 8px; }
    button { margin: 8px 8px 8px 0; padding: 8px 14px; cursor: pointer; }
    .composer-actions button { margin: 4px 0 0; border: 0; border-radius: 999px; }
    #send-button { color: #fff; background: #202123; }
    #send-button:disabled, #stop-button:disabled { opacity: 0.45; cursor: default; }
    #error { color: #b00020; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="chat-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span>LitAgent</span>
      </div>
      <button id="new-chat-button" type="button">
        <span class="new-chat-icon" aria-hidden="true">＋</span>
        <span>新建聊天</span>
      </button>
      <div class="sidebar-section-label">最近聊天</div>
      <div id="conversation-list" aria-label="聊天列表"></div>
    </aside>

    <main class="chat-main">
      <div id="message-list" aria-live="polite"></div>
      <div id="error"></div>
      <form id="chat-form">
        <textarea id="message" placeholder="请输入需求"></textarea>
        <div class="composer-actions">
          <button id="send-button" type="submit">发送</button>
          <button id="stop-button" type="button" disabled>停止</button>
        </div>
      </form>
    </main>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"
    onerror="console.error('[Markdown] Failed to load marked.js from jsDelivr')"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
    onerror="console.error('[Markdown] Failed to load DOMPurify from jsDelivr')"
  ></script>
  <script>
    const STORAGE_KEY = 'litagent.conversations.v1';
    const form = document.getElementById('chat-form');
    const messageInput = document.getElementById('message');
    const sendButton = document.getElementById('send-button');
    const stopButton = document.getElementById('stop-button');
    const messageList = document.getElementById('message-list');
    const conversationList = document.getElementById('conversation-list');
    const error = document.getElementById('error');
    let controller = null;

    function newId() {
      return crypto.randomUUID();
    }

    function loadSavedState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return {
          conversations: Array.isArray(saved.conversations)
            ? saved.conversations
            : [],
          activeConversationId: saved.activeConversationId || null,
        };
      } catch (_error) {
        return { conversations: [], activeConversationId: null };
      }
    }

    const savedState = loadSavedState();
    let conversations = savedState.conversations;
    let activeConversationId = savedState.activeConversationId;

    function persistState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        conversations,
        activeConversationId,
      }));
    }

    function getActiveConversation() {
      return conversations.find(
        (conversation) => conversation.id === activeConversationId
      );
    }

    function renderConversations() {
      conversationList.replaceChildren();
      for (const conversation of conversations) {
        const item = document.createElement('div');
        item.className = 'conversation-item';
        if (conversation.id === activeConversationId) {
          item.classList.add('active');
        }

        const titleButton = document.createElement('button');
        titleButton.type = 'button';
        titleButton.className = 'conversation-button';
        titleButton.textContent = conversation.title || '新聊天';
        titleButton.title = conversation.title || '新聊天';
        titleButton.addEventListener('click', () => {
          activeConversationId = conversation.id;
          persistState();
          render();
        });

        const menuTrigger = document.createElement('button');
        menuTrigger.type = 'button';
        menuTrigger.className = 'conversation-menu-trigger';
        menuTrigger.textContent = '⋯';
        menuTrigger.setAttribute('aria-label', '聊天选项');
        menuTrigger.setAttribute('aria-haspopup', 'menu');
        menuTrigger.setAttribute('aria-expanded', 'false');

        const menu = document.createElement('div');
        menu.className = 'conversation-menu';
        menu.setAttribute('role', 'menu');
        menu.hidden = true;

        const renameButton = document.createElement('button');
        renameButton.type = 'button';
        renameButton.textContent = '重命名';
        renameButton.setAttribute('role', 'menuitem');
        renameButton.addEventListener('click', () => {
          menu.hidden = true;
          beginRename(conversation, titleButton);
        });

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'conversation-delete-action';
        deleteButton.textContent = '\u5220\u9664\u804a\u5929';
        deleteButton.setAttribute('role', 'menuitem');
        deleteButton.addEventListener('click', () => {
          menu.hidden = true;
          menuTrigger.setAttribute('aria-expanded', 'false');
          deleteConversation(conversation);
        });
        menu.append(renameButton, deleteButton);

        menuTrigger.addEventListener('click', (event) => {
          event.stopPropagation();
          const shouldOpen = menu.hidden;
          conversationList.querySelectorAll('.conversation-menu').forEach(
            (otherMenu) => { otherMenu.hidden = true; },
          );
          conversationList.querySelectorAll('.conversation-menu-trigger').forEach(
            (otherTrigger) => otherTrigger.setAttribute('aria-expanded', 'false'),
          );
          menu.hidden = !shouldOpen;
          menuTrigger.setAttribute('aria-expanded', String(shouldOpen));
        });

        item.append(titleButton, menuTrigger, menu);
        conversationList.append(item);
      }
    }

    function deleteConversation(conversation) {
      const title = conversation.title || '\u65b0\u804a\u5929';
      const confirmed = window.confirm(
        `\u786e\u5b9a\u5220\u9664\u201c${title}\u201d\u5417\uff1f`
      );
      if (!confirmed) return;

      const wasActive = conversation.id === activeConversationId;
      conversations = conversations.filter(
        (item) => item.id !== conversation.id
      );

      if (wasActive && conversations.length > 0) {
        activeConversationId = conversations[0].id;
      } else if (wasActive) {
        createConversation();
        return;
      }

      persistState();
      if (wasActive) {
        render();
      } else {
        renderConversations();
      }
    }

    function beginRename(conversation, titleButton) {
      const originalTitle = (conversation.title || '新聊天').trim() || '新聊天';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'conversation-rename-input';
      input.value = originalTitle;
      input.setAttribute('aria-label', '聊天标题');
      titleButton.replaceWith(input);

      let finished = false;
      const finish = (save) => {
        if (finished) return;
        finished = true;
        if (save) {
          conversation.title = input.value.trim() || originalTitle;
          persistState();
        }
        renderConversations();
      };

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          finish(true);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          finish(false);
        }
      });
      input.addEventListener('blur', () => finish(true));
      input.focus();
      input.select();
    }

    if (typeof window.marked?.parse !== 'function') {
      console.error('[Markdown] marked.js is unavailable or did not expose marked.parse');
    }
    if (typeof window.DOMPurify?.sanitize !== 'function') {
      console.error('[Markdown] DOMPurify is unavailable or did not expose sanitize');
    }

    function renderAssistantMarkdown(markdown, element) {
      if (typeof window.marked?.parse !== 'function') {
        throw new Error('marked.parse is unavailable');
      }
      if (typeof window.DOMPurify?.sanitize !== 'function') {
        throw new Error('DOMPurify.sanitize is unavailable');
      }

      const html = window.marked.parse(markdown || '');
      element.innerHTML = window.DOMPurify.sanitize(
        html,
        { USE_PROFILES: { html: true } },
      );
    }

    function renderMessages() {
      messageList.replaceChildren();
      const conversation = getActiveConversation();
      for (const message of conversation?.messages || []) {
        const row = document.createElement('div');
        row.className = `message-row ${message.role}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';

        const content = document.createElement('div');
        content.className = 'message-content';
        if (message.role === 'assistant') {
          try {
            renderAssistantMarkdown(message.content, content);
          } catch (renderError) {
            console.error('[Markdown] Failed to render Assistant message', renderError);
          }
        } else {
          content.textContent = message.content || '';
        }

        bubble.append(content);
        row.append(bubble);
        messageList.append(row);
      }
      requestAnimationFrame(() => {
        messageList.scrollTop = messageList.scrollHeight;
      });
    }

    function render() {
      renderConversations();
      renderMessages();
    }

    function createConversation() {
      const conversation = {
        id: newId(),
        thread_id: null,
        title: '新聊天',
        messages: [],
      };
      conversations.unshift(conversation);
      activeConversationId = conversation.id;
      persistState();
      render();
      messageInput.focus();
    }

    async function requestChat(text, conversation, resume = null) {
      const body = { message: text };
      if (conversation.thread_id) body.thread_id = conversation.thread_id;
      if (resume !== null) body.resume = resume;

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.detail || '请求失败');
      }

      if (data.thread_id) {
        conversation.thread_id = data.thread_id;
        persistState();
      }
      return data;
    }

    async function runChat(text, conversation) {
      let data = await requestChat(text, conversation);

      while (data.interrupt?.type === 'external_search_approval') {
        const approved = window.confirm(
          `${data.interrupt.message}\n\n${data.interrupt.query}`
        );
        data = await requestChat(text, conversation, approved);
      }

      conversation.messages.push({
        role: 'assistant',
        content: data.answer || '当前没有返回回答。',
      });
      persistState();
      renderMessages();
    }

    document.getElementById('new-chat-button').addEventListener(
      'click',
      createConversation,
    );

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      const conversation = getActiveConversation();
      if (!text || !conversation) return;

      conversation.messages.push({ role: 'user', content: text });
      persistState();
      renderMessages();
      messageInput.value = '';
      error.textContent = '';

      controller = new AbortController();
      sendButton.disabled = true;
      stopButton.disabled = false;

      try {
        await runChat(text, conversation);
      } catch (err) {
        error.textContent = err.name === 'AbortError'
          ? '请求已停止。'
          : err.message;
      } finally {
        controller = null;
        sendButton.disabled = false;
        stopButton.disabled = true;
      }
    });

    stopButton.addEventListener('click', () => {
      if (controller) controller.abort();
    });

    if (!getActiveConversation()) {
      if (conversations.length) {
        activeConversationId = conversations[0].id;
      } else {
        createConversation();
      }
    }
    persistState();
    render();
  </script>
</body>
</html>
